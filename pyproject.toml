[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "graba-reunion"
version = "0.4.0"
description = "Graba micrófono + monitor PulseAudio, transcribe y genera minuta (WhisperX + Groq)"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.11",
    "whisperx>=3.8",
    "faster-whisper>=1.0",
]
license = "MIT"
keywords = ["audio", "pulseaudio", "ffmpeg", "whisper", "recording", "diarization"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
graba-reunion = "graba_reunion.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/graba_reunion"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
