[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "graba-reunion"
version = "0.5.0"
description = "Graba micrófono + monitor, transcribe con WhisperX y opcionalmente minuta con Groq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.11",
    "whisperx>=3.8",
    "faster-whisper>=1.0",
    "sentence-transformers>=3.0,<5",
]
license = "MIT"
keywords = ["audio", "pulseaudio", "ffmpeg", "whisper", "recording", "diarization"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/pablogventura/graba_reunion"
Repository = "https://github.com/pablogventura/graba_reunion"
Documentation = "https://github.com/pablogventura/graba_reunion/blob/main/docs/guia-completa.md"
Issues = "https://github.com/pablogventura/graba_reunion/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
graba-reunion = "graba_reunion.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/graba_reunion"]

[tool.hatch.build.targets.wheel.force-include]
"src/graba_reunion/viewer/index.html" = "graba_reunion/viewer/index.html"
"src/graba_reunion/viewer/app.js" = "graba_reunion/viewer/app.js"
"src/graba_reunion/viewer/app.css" = "graba_reunion/viewer/app.css"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
